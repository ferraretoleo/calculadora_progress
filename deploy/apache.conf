<VirtualHost *:10000>
    DocumentRoot /var/www/calculadora/public
    <Directory /var/www/calculadora/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    # %U omite query strings que podem conter tokens de recuperação.
    LogFormat "%h %t %m %U %>s %b" safe
    CustomLog /proc/self/fd/1 safe
</VirtualHost>
